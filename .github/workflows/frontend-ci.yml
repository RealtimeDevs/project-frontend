
name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - qa
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest

    steps:
      - name: Validate source and target branches
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          echo "Source: $SOURCE"
          echo "Target: $TARGET"

          if [[ "$SOURCE_REPO" != "$TARGET_REPO" ]]; then
            echo "::error::Fork PRs are not permitted"
            exit 1
          fi

          case "$TARGET" in
            dev)
              if [[ "$SOURCE" != feature/* ]]; then
                echo "::error::Only feature/* can merge into dev"
                exit 1
              fi
              ;;
            qa)
              if [[ "$SOURCE" != "dev" ]]; then
                echo "::error::Only dev can merge into qa"
                exit 1
              fi
              ;;
            main)
              if [[ "$SOURCE" != "qa" ]]; then
                echo "::error::Only qa can merge into main"
                exit 1
              fi
              ;;
          esac

          echo "Branch policy passed"

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build React application
        run: npm run build

      - name: Run unit tests if available
        run: npm run test --if-present
